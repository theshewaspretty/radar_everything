name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build demo app
        working-directory: frontend
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE: ./
        run: |
          npm ci
          npm run build

      - name: Assemble docs site
        run: |
          rm -rf docs/app
          mkdir -p docs/app
          cp -R frontend/dist/. docs/app/
          cp docs/app/index.html docs/app/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
